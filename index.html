<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-Server Network Simulator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e24; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        h1 { margin-top: 10px; margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; text-align: center; max-width: 600px; font-size: 18px;}
        #controls { margin: 15px 0; }
        button { 
            background-color: #2196F3; /* Blue for server theme */
            color: white; 
            border: none; 
            padding: 12px 24px; 
            text-align: center; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 5px; 
            margin: 0 10px; 
            transition: 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #0b7dda; }
        button#resetBtn { background-color: #f44336; }
        button#resetBtn:hover { background-color: #da190b; }
        canvas { 
            background-color: #2b2b36; 
            border: 2px solid #555; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .legend { display: flex; gap: 25px; margin-top: 15px; font-size: 16px; font-weight: bold;}
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .color-box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #fff; }
        #status { font-size: 18px; font-weight: bold; color: #FF9800; margin-top: 10px; height: 24px; }
    </style>
</head>
<body>

<h1>How Client-Server Works</h1>
<p>Notice how <strong>only</strong> the server does the work. Watch what happens to the speed as more clients connect!</p>

<div id="controls">
    <button id="addNodeBtn">+ Add a Client</button>
    <button id="startSharingBtn">▶ Server: Send File</button>
    <button id="resetBtn">↻ Reset</button>
</div>

<canvas id="networkCanvas" width="800" height="450"></canvas>

<div id="status">Server Load: Low (Fast Speed)</div>

<div class="legend">
    <div class="legend-item"><div class="color-box" style="background: #4CAF50;"></div> Server (100%)</div>
    <div class="legend-item"><div class="color-box" style="background: #FFC107;"></div> Downloading (25-75%)</div>
    <div class="legend-item"><div class="color-box" style="background: #F44336;"></div> Waiting (0%)</div>
</div>

<script>
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let nodes = [];
    let edges = [];
    let packets = [];
    const maxNodes = 9; // 1 center server + 8 clients
    let animationId;
    let isSharing = false;

    class Node {
        constructor(id, x, y, isServer) {
            this.id = id;
            this.x = x;
            this.y = y;
            this.isServer = isServer;
            this.status = isServer ? 'full' : 'empty'; 
            this.chunks = isServer ? 4 : 0;
            this.maxChunks = 4;
            this.radius = isServer ? 40 : 32; // Server is visually larger
        }
        draw() {
            ctx.beginPath();
            if (this.isServer) {
                // Draw Server as a square to distinguish it
                ctx.rect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            }
            
            if (this.status === 'full') {
                ctx.fillStyle = '#4CAF50'; 
            } else if (this.status === 'partial') {
                ctx.fillStyle = '#FFC107'; 
            } else {
                ctx.fillStyle = '#F44336'; 
            }
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (this.isServer) {
                ctx.fillText(`SERVER`, this.x, this.y);
            } else {
                let percentage = (this.chunks / this.maxChunks) * 100;
                ctx.fillText(`${percentage}%`, this.x, this.y);
            }
        }
    }

    class Edge {
        constructor(node1, node2) {
            this.node1 = node1;
            this.node2 = node2;
        }
        draw() {
            ctx.beginPath();
            ctx.moveTo(this.node1.x, this.node1.y);
            ctx.lineTo(this.node2.x, this.node2.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }

    class Packet {
        constructor(source, target, speed) {
            this.source = source;
            this.target = target;
            this.progress = 0;
            this.speed = speed;
        }
        update() {
            this.progress += this.speed;
        }
        draw() {
            const x = this.source.x + (this.target.x - this.source.x) * this.progress;
            const y = this.source.y + (this.target.y - this.source.y) * this.progress;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2); 
            ctx.fillStyle = '#2196F3'; // Blue packets for server traffic
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function initNetwork() {
        nodes = [];
        edges = [];
        packets = [];
        isSharing = false;
        
        // Add Server in the center
        addNode(true);
        // Add ONE initial client
        addNode(false); 
        updateStatus();
    }

    function addNode(isServer = false) {
        if (nodes.length >= maxNodes) return;
        
        const id = nodes.length;
        let x, y;
        
        if (id === 0) {
            x = canvas.width / 2;
            y = canvas.height / 2;
        } else {
            const radius = 170; 
            const angle = (id - 1) * (Math.PI * 2) / (maxNodes - 1);
            x = (canvas.width / 2) + radius * Math.cos(angle);
            y = (canvas.height / 2) + radius * Math.sin(angle);
        }
        
        const newNode = new Node(id, x, y, isServer);
        nodes.push(newNode);
        
        // --- CLIENT-SERVER TOPOLOGY ---
        // Clients ONLY connect to the Server (Node 0). No circle connections.
        if (id > 0) {
            edges.push(new Edge(newNode, nodes[0]));
        }
        updateStatus();
    }

    function updateStatus() {
        let clients = nodes.length - 1;
        if (clients <= 2) {
            statusText.innerText = "Server Load: Low (Fast Speed)";
            statusText.style.color = "#4CAF50";
        } else if (clients <= 5) {
            statusText.innerText = "Server Load: Medium (Moderate Speed)";
            statusText.style.color = "#FFC107";
        } else {
            statusText.innerText = "Server Load: High (Bottlenecked / Slow)";
            statusText.style.color = "#F44336";
        }
    }

    function updateNetwork() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        edges.forEach(e => e.draw());
        
        for (let i = packets.length - 1; i >= 0; i--) {
            let p = packets[i];
            p.update();
            p.draw();
            
            if (p.progress >= 1) {
                if (p.target.chunks < p.target.maxChunks) {
                    p.target.chunks++;
                    if (p.target.chunks === p.target.maxChunks) {
                        p.target.status = 'full';
                    } else {
                        p.target.status = 'partial';
                    }
                }
                packets.splice(i, 1);
            }
        }
        
        nodes.forEach(n => n.draw());
        
        if (isSharing) { 
            let server = nodes[0];
            let activeClients = nodes.filter(n => n.id !== 0 && n.chunks < n.maxChunks);
            
            // BOTTLENECK LOGIC: The more active clients, the slower the packets go
            let speed = 0.012; // Base speed
            if (activeClients.length > 0) {
                speed = Math.max(0.002, 0.012 - (activeClients.length * 0.0015));
            }

            // Server randomly dispatches packets to clients needing data
            if (activeClients.length > 0 && Math.random() < 0.08) {
                let target = activeClients[Math.floor(Math.random() * activeClients.length)];
                
                // Limit how many packets the server can send at once to show struggle
                let packetsToTarget = packets.filter(p => p.target === target).length;
                if (packetsToTarget < 1) {
                    packets.push(new Packet(server, target, speed));
                }
            }
        }
        animationId = requestAnimationFrame(updateNetwork);
    }

    document.getElementById('addNodeBtn').addEventListener('click', () => addNode(false));
    document.getElementById('startSharingBtn').addEventListener('click', () => isSharing = true);
    document.getElementById('resetBtn').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        initNetwork();
        updateNetwork();
    });

    initNetwork();
    updateNetwork();
</script>
</body>
</html>
